name: Build Component Showcase APK
on:
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'scripts/**', 'pubspec.yaml', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: component-showcase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
          pub-cache: true
      - name: Prepare Android host
        run: |
          flutter config --no-analytics
          flutter create --platforms=android --org com.axon --project-name axon_flclash_flutter --no-pub .
          bash scripts/prepare_android.sh
          flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        run: flutter test --reporter expanded
      - name: Build ARM64 release APK
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Component-Preview-arm64.apk
          (cd dist && sha256sum Component-Preview-arm64.apk > SHA256SUMS.txt)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Component-Preview-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
